# Small test sweep for milestone 1: reach and whole-electorate truncation
# under Scottish rules, with the draft 0.1 model.

[run]
name = "test-truncation-100"
seed = 1
sims = 100
threads = 0              # 0 = all cores
rules = "scottish"       # or "reference" (validation only)
surplus_order = "largest"
truncation = true
curve_ranks = 0         # 0 = write the whole curve

[election]
candidates = 100
seats = [1, 3, 5, 10, 20, 30, 50, 70, 90]
ranks = 100              # cap; never more than the number of candidates

[model]
slates = 4
slate_loyalty = 0.15
popularity_spread = 1.0
