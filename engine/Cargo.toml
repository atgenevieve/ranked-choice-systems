[package]
name = "stvsim"
version = "0.2.0"
edition = "2021"

[lib]
name = "stvsim"
path = "src/lib.rs"
# rlib for the command-line program; cdylib for the tuner's WebAssembly build.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "stvsim"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
