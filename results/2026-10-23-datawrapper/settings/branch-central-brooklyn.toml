# Central Brooklyn: 132 candidates, 83 seats, about 838 ballots.
# Organization members, a ballot that says "rank up to N" with N equal to the seats,
# and the model's default loose slates (model version 0.2), as on the branch page.

[run]
name = "branch-central-brooklyn"
seed = 1
sims = 2000
threads = 0
truncation = true
curve_ranks = 0

[election]
candidates = 132
seats = [83]
voters = 838
turnout_spread = 0.1
ranks = 132

[electorate]
type = "organization"

[ballot]
wording = "up_to"
n = "seats"

[model]
version = "0.2"
