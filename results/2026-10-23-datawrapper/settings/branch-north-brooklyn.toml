# North Brooklyn: 105 candidates, 76 seats, about 731 ballots.
# Organization members, a ballot that says "rank up to N" with N equal to the seats,
# and the model's default loose slates (model version 0.2), as on the branch page.

[run]
name = "branch-north-brooklyn"
seed = 1
sims = 2000
threads = 0
truncation = true
curve_ranks = 0

[election]
candidates = 105
seats = [76]
voters = 731
turnout_spread = 0.1
ranks = 105

[electorate]
type = "organization"

[ballot]
wording = "up_to"
n = "seats"

[model]
version = "0.2"
